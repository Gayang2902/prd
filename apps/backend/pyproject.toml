[project]
name = "securescope-backend"
version = "0.1.0"
description = "SecureScope - 사내 코드 정적 분석 대시보드 백엔드"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "authlib>=1.4.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    "temporalio>=1.7.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "testcontainers[postgres,redis]>=4.8.0",
    "black>=24.10.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.entry-points."securescope.agents"]
mcp-finding = "app.agents.mcp_finding_agent:McpFindingAgent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "A", "C4", "T20", "RET", "SIM", "UP"]
ignore = ["B008", "A002", "UP042"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T201"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
