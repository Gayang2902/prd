[project]
name = "securescope-agent-claude-code"
version = "0.1.0"
description = "Claude Code security analysis agent for SecureScope"
requires-python = ">=3.11"
dependencies = [
    "securescope-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["agent.py"]

[project.entry-points."securescope.agents"]
claude-code = "agent:ClaudeCodeAgent"
