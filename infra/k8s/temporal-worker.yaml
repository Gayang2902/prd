apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-worker
  namespace: securescope-dev
  labels:
    app: temporal-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: temporal-worker
  template:
    metadata:
      labels:
        app: temporal-worker
    spec:
      serviceAccountName: agent-sandbox-sa
      containers:
        - name: worker
          image: securescope-backend:latest
          command: ["python", "-m", "app.worker"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: securescope-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: securescope-secrets
                  key: redis-url
            - name: TEMPORAL_HOST
              value: temporal:7233
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            exec:
              command: ["python", "-c", "print('ok')"]
            initialDelaySeconds: 10
            periodSeconds: 30
      restartPolicy: Always
