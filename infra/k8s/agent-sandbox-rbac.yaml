apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sandbox-sa
  namespace: securescope-dev
  labels:
    app: agent-sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-sandbox-role
  namespace: securescope-dev
spec:
  rules:
    - apiGroups: ["batch"]
      resources: ["jobs"]
      verbs: ["create", "get", "list", "watch", "delete"]
    - apiGroups: [""]
      resources: ["pods", "pods/log"]
      verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-sandbox-binding
  namespace: securescope-dev
subjects:
  - kind: ServiceAccount
    name: agent-sandbox-sa
    namespace: securescope-dev
roleRef:
  kind: Role
  name: agent-sandbox-role
  apiGroup: rbac.authorization.k8s.io
