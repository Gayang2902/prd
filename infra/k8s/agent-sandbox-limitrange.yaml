apiVersion: v1
kind: LimitRange
metadata:
  name: agent-sandbox-limits
  namespace: securescope-dev
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 4Gi
      defaultRequest:
        cpu: 500m
        memory: 1Gi
      max:
        cpu: "4"
        memory: 8Gi
    - type: Pod
      max:
        cpu: "4"
        memory: 8Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agent-sandbox-quota
  namespace: securescope-dev
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    pods: "20"
    count/jobs.batch: "10"
