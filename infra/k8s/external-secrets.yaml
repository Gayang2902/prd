apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: securescope-dev
spec:
  provider:
    vault:
      server: "http://vault.vault.svc:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "securescope"
          serviceAccountRef:
            name: agent-sandbox-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: securescope-secrets
  namespace: securescope-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: securescope-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: securescope/database
        property: url
    - secretKey: redis-url
      remoteRef:
        key: securescope/redis
        property: url
    - secretKey: jwt-secret
      remoteRef:
        key: securescope/auth
        property: jwt-secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gitlab-credentials
  namespace: securescope-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: gitlab-credentials
    creationPolicy: Owner
  data:
    - secretKey: gitlab-token
      remoteRef:
        key: securescope/gitlab
        property: api-token
    - secretKey: gitlab-url
      remoteRef:
        key: securescope/gitlab
        property: url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-api-keys
  namespace: securescope-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: llm-api-keys
    creationPolicy: Owner
  data:
    - secretKey: anthropic-api-key
      remoteRef:
        key: securescope/llm
        property: anthropic-api-key
    - secretKey: openai-api-key
      remoteRef:
        key: securescope/llm
        property: openai-api-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: notification-secrets
  namespace: securescope-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: notification-secrets
    creationPolicy: Owner
  data:
    - secretKey: slack-webhook-url
      remoteRef:
        key: securescope/notifications
        property: slack-webhook-url
    - secretKey: smtp-password
      remoteRef:
        key: securescope/notifications
        property: smtp-password
