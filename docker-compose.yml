services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: securescope
      POSTGRES_USER: securescope
      POSTGRES_PASSWORD: localdev
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securescope"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "18000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://securescope:localdev@postgres:5432/securescope
      REDIS_URL: redis://redis:6379/0
      TEMPORAL_HOST: temporal:7233
      CORS_ORIGINS: '["http://localhost:13000"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:1.24
    ports:
      - "7233:7233"
    environment:
      DB: postgres12_pgx
      DB_PORT: 5432
      POSTGRES_USER: securescope
      POSTGRES_PWD: localdev
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:18000/api/v1
        NEXT_PUBLIC_WS_URL: ws://localhost:18000
    ports:
      - "13000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
